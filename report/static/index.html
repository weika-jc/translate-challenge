<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻译模型评估报告</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>翻译模型评估报告</h1>
      <p id="subtitle">加载中…</p>
    </div>
    <div class="model-tabs" id="model-tabs"></div>
  </header>

  <main>
    <div id="loading" class="loading">正在加载评估数据…</div>
    <div id="content" class="hidden">
      <section id="overview-section">
        <h2 class="section-title">综合概览</h2>
        <div class="cards" id="overview-cards"></div>
      </section>

      <section id="reliability-section" class="compare-section hidden">
        <div class="section-heading">
          <div>
            <h2 class="section-title">调用可靠性</h2>
            <p class="section-note">首次请求成功表示第一次即得到可用结果；调用返回率只看服务是否返回。最终恢复后的结果才进入质量评分。</p>
          </div>
        </div>
        <div class="panel table-scroll">
          <table class="compare-table reliability-table" id="reliability-table">
            <thead>
              <tr>
                <th>模型</th>
                <th>阶段</th>
                <th>已记录</th>
                <th>首次请求成功率</th>
                <th>首次调用返回率</th>
                <th>发生重试</th>
                <th>重试恢复</th>
                <th>最终不可用</th>
                <th>平均重试</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="compare-section" class="compare-section hidden">
        <h2 class="section-title">模型对比</h2>
        <div class="panel table-scroll">
          <table class="compare-table" id="compare-table">
            <thead>
              <tr>
                <th data-sort-key="name" aria-sort="none"><button class="sort-button" type="button">模型 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="count" aria-sort="none"><button class="sort-button" type="button">样本数 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="avgScore" aria-sort="descending"><button class="sort-button" type="button">平均分 <span class="sort-indicator" aria-hidden="true">↓</span></button></th>
                <th data-sort-key="medianScore" aria-sort="none"><button class="sort-button" type="button">中位数 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="scoreRange" aria-sort="none" title="按最低分排序"><button class="sort-button" type="button">最低/最高 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="avgLatency" aria-sort="none"><button class="sort-button" type="button">平均延迟 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="p95Latency" aria-sort="none"><button class="sort-button" type="button">P95 延迟 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="cacheHit" aria-sort="none"><button class="sort-button" type="button">缓存命中 % <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="lowScore" aria-sort="none"><button class="sort-button" type="button">&lt;50 分占比 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="malformed" aria-sort="none"><button class="sort-button" type="button">格式错误 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="callFailed" aria-sort="none"><button class="sort-button" type="button">调用失败 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="languageFailed" aria-sort="none"><button class="sort-button" type="button">语言错误 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="policyFailed" aria-sort="none"><button class="sort-button" type="button">规则失败 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="judgeFailed" aria-sort="none"><button class="sort-button" type="button">Judge 失败 <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="totalCost" aria-sort="none"><button class="sort-button" type="button">总价（估算） <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="pairwise-section" class="compare-section hidden">
        <div class="section-heading">
          <div>
            <h2 class="section-title">配对质量比较</h2>
            <p class="section-note" id="pairwise-method"></p>
          </div>
          <div class="matrix-legend" aria-label="比较结果图例">
            <span><i class="legend-dot win"></i>纵轴更优</span>
            <span><i class="legend-dot loss"></i>纵轴更差</span>
            <span><i class="legend-dot uncertain"></i>差异不明确</span>
          </div>
        </div>
        <div class="panel comparison-matrix-panel">
          <div class="matrix-axis-note">
            <span class="axis-row">纵轴模型</span>
            <span class="axis-relation">相对</span>
            <span class="axis-column">横轴模型</span>
          </div>
          <div class="matrix-scroll">
            <table class="pairwise-matrix" id="pairwise-matrix" aria-label="模型配对质量比较矩阵"></table>
          </div>
        </div>
        <div class="pair-tooltip hidden" id="pair-tooltip" role="tooltip"></div>
      </section>

      <section>
        <h2 class="section-title">维度分析</h2>
        <div class="grid-2">
          <div class="panel">
            <h3>评分分布</h3>
            <div class="chart-wrap"><canvas id="chart-distribution"></canvas></div>
          </div>
          <div class="panel">
            <h3>按数据集</h3>
            <div class="chart-wrap"><canvas id="chart-dataset"></canvas></div>
          </div>
        </div>
        <div class="grid-2">
          <div class="panel">
            <h3>按语言对（Top 15）</h3>
            <div class="chart-wrap"><canvas id="chart-langpair"></canvas></div>
          </div>
          <div class="panel">
            <h3>延迟分布</h3>
            <div class="chart-wrap"><canvas id="chart-latency"></canvas></div>
          </div>
        </div>
      </section>

      <section>
        <h2 class="section-title">明细记录</h2>
        <div class="filters">
          <label>数据集
            <select id="filter-dataset"><option value="">全部</option></select>
          </label>
          <label>语言对
            <select id="filter-langpair"><option value="">全部</option></select>
          </label>
          <label>最低分
            <input type="number" id="filter-min-score" min="0" max="100" placeholder="0">
          </label>
          <label>最高分
            <input type="number" id="filter-max-score" min="0" max="100" placeholder="100">
          </label>
          <label>搜索
            <input type="search" id="filter-q" placeholder="原文 / 译文 / 参考">
          </label>
        </div>
        <div class="records-table-wrap">
          <table class="records-table">
            <thead>
              <tr>
                <th>数据集</th>
                <th>语言对</th>
                <th>原文</th>
                <th>参考译文</th>
                <th>模型输出</th>
                <th>评分</th>
                <th>状态</th>
                <th>调用</th>
                <th>延迟</th>
                <th>Token</th>
                <th>价格</th>
              </tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="page-info"></span>
          <div>
            <button id="prev-page">上一页</button>
            <button id="next-page">下一页</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
